
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pesquisa de Satisfação</title>
</head>
<body>

    <h1>Pesquisa de Satisfação do Cliente</h1>

    <form action="#" method="post">
        
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="nome">Nome:</label><br>
                <input type="text" id="nome" name="nome" required>
            </p>
            <p>
                <label for="email">E-mail:</label><br>
                <input type="email" id="email" name="email" required>
            </p>
            <p>
                <label for="telefone">Telefone para contato:</label><br>
                <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
            </p>
        </fieldset>

        <br>

        <fieldset>
            <legend>Pesquisa</legend>

            <p>1. Como você avalia nosso atendimento geral?</p>
            <input type="radio" id="otimo" name="atendimento" value="otimo">
            <label for="otimo">Ótimo</label><br>
            <input type="radio" id="bom" name="atendimento" value="bom">
            <label for="bom">Bom</label><br>
            <input type="radio" id="regular" name="atendimento" value="regular">
            <label for="regular">Regular</label>

            <p>2. Você recomendaria nossos serviços a um amigo?</p>
            <input type="radio" id="sim" name="recomenda" value="sim">
            <label for="sim">Sim</label><br>
            <input type="radio" id="nao" name="recomenda" value="nao">
            <label for="nao">Não</label>

            <p>3. Qual canal de comunicação você mais utiliza?</p>
            <select name="canal" id="canal">
                <option value="">Selecione uma opção</option>
                <option value="whatsapp">WhatsApp</option>
                <option value="email">E-mail</option>
                <option value="telefone">Ligação Telefônica</option>
                <option value="presencial">Presencial</option>
            </select>
        </fieldset>

        <br>

        <p>
            <input type="checkbox" id="autoriza" name="autoriza" value="sim">
            <label for="autoriza">Autorizo compartilhar minha resposta com terceiros.</label>
        </p>

        <button type="submit">Enviar Pesquisa</button>

    </form>

</body>
</html>
